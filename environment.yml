  - pip
  - numpy
  - scipy
  - pandas
  - matplotlib
  - scikit-learn
  - statsmodels
  - ipykernel
  - jupyterlab
  - pytorch=1.10.*
  - torchvision=0.11.*
  - h5py
  - tqdm
  - pyyaml
  - pip:
      - pytorch-lightning==1.4.7
      - torchmetrics==0.5.1
      - tensorboard==2.6.0
